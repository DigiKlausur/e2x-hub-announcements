name: Build
on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions with twine
        run: twine check --strict dist/*

      # Install from the built wheel rather than the source tree, so a file
      # missing from the wheel (e.g. the shared-data templates) fails here
      # instead of after a release.
      - name: Install the wheel
        run: python -m pip install dist/*.whl

      # `-I` keeps the current directory (the checkout) off sys.path, so this
      # imports the installed wheel, not the source tree.
      - name: Smoke test the installed package
        run: |
          python -I - <<'EOF'
          import sys
          from pathlib import Path

          from e2x_hub_announcements._data import DATA_FILES_PATH
          from e2x_hub_announcements.hub import configure_announcements

          print("Loaded:", configure_announcements)

          share = Path(sys.prefix) / "share" / "e2x_hub_announcements"
          assert Path(DATA_FILES_PATH) == share, f"data files resolved to {DATA_FILES_PATH!r}"
          for name in ("jupyterhub/page.html", "service/index.j2"):
              assert (share / "templates" / name).is_file(), f"missing shared template: {name}"
          EOF

      - name: Install test dependencies
        run: python -m pip install "$(ls dist/*.whl)[test]"

      # Run `pytest`, not `python -m pytest`: the latter puts the source tree on
      # sys.path, so the tests would import it instead of the installed wheel.
      - name: Run tests against the installed wheel
        run: pytest

      - name: Upload distributions
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
